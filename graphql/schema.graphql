"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    "Find a single user by an identifying attribute."
    user(
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)

    "Find a single product by ID."
    product(id: ID! @eq): Product @find

    "List products with optional filters."
    products(
      name: String @where(operator: "like")
      is_active: Boolean @eq
    ): [Product!]! @paginate(defaultCount: 10)
}

type Mutation {
    "Create a new user."
    createUser(input: CreateUserInput! @spread): User! @create

    "Update an existing user."
    updateUser(id: ID!, input: UpdateUserInput! @spread): User! @update

    "Delete a user."
    deleteUser(id: ID! @whereKey): User! @delete

    "Create a new product."
    createProduct(input: CreateProductInput! @spread): Product! @create

    "Update an existing product."
    updateProduct(id: ID!, input: UpdateProductInput! @spread): Product! @update

    "Delete a product."
    deleteProduct(id: ID! @whereKey): Product! @delete
}

input CreateUserInput {
    name: String!
    email: String!
    password: String! @hash
}

input UpdateUserInput {
    name: String
    email: String
    password: String @hash
}

input CreateProductInput {
    name: String!
    description: String
    price: Int!
    stock: Int! = 0
    sku: String!
    is_active: Boolean = true
}

input UpdateProductInput {
    name: String
    description: String
    price: Int
    stock: Int
    sku: String
    is_active: Boolean
}

type Product {
    id: ID!
    name: String!
    description: String
    price: Int!
    stock: Int!
    sku: String!
    is_active: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type User {
    id: ID!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}
